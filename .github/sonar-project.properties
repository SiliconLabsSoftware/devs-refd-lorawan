# sonar.host.url=Currently using github secret
# must be unique in a given SonarQube instance
# update this value based on the project name
sonar.projectKey=devs-refd-lorawan

sonar.cfamily.variants.dir=sonar-bw

# we don't care which version, SQ is just too dumb to ignore python language when it sees (even if we try excluding it in sonar.exclusions)
sonar.python.version=3.11

# Path is relative to sonar.projectBaseDir (repo root in CI). Scope via exclusions below.
# Intended in-scope paths:
#   projects/lorawan_extension/components/lbm_applications/4_porting_efr32/{main_examples,radio_hal,smtc_hal_efr32,smtc_modem_hal,smtc_modem_crypto}/
#   projects/lorawan_extension/test/
sonar.sources=.

# Branch name for the analysis
# sonar.branch.name=Currently configured in the github action

sonar.exclusions= \
   **/*.slcc, \
   **/*.slcp, \
   **/*.slce, \
   **/simplicity_sdk*/**, \
   **/gecko_sdk*/**, \
   **/config/**, \
   **/autogen/**, \
   **/image/**, \
   resources/**, \
   lbm/**, \
   sonar-bw/**, \
   artifacts/**, \
   .github/**, \
   Dockerfile, \
   **/*.md, \
   Makefile, \
   projects/swl2001_paching/**, \
   projects/swl2001_patching_generate/**, \
   projects/slt/**, \
   projects/lorawan_extension/components/SWL2001/**, \
   projects/lorawan_extension/config/**, \
   projects/lorawan_extension/docs/**, \
   projects/lorawan_extension/examples/**, \
   projects/lorawan_extension/*.xml, \
   projects/lorawan_extension/components/lbm_applications/4_porting_efr32/mcu_drivers/**, \
   projects/lorawan_extension/components/lbm_applications/4_porting_efr32/app_makefiles/**, \
   projects/lorawan_extension/components/lbm_applications/4_porting_efr32/Makefile

sonar.cpd.exclusions= \
   projects/lorawan_extension/components/SWL2001/**/*, \
   projects/swl2001_paching/**/*, \
   **/simplicity_sdk*/**/*, \
   lbm/**/*, \
   sonar-bw/**/*
sonar.coverage.exclusions = **
