name: 05-SonarQube-Analysis

on:
  pull_request:
    branches:
      - main
      - master
      - develop
      - "release/**"
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branches to run the workflow on"
        required: true
        default: "main"
      sonar-branch:
        description: "Sonar project branch name."
        required: false
        default: ""
permissions:
  contents: read
env:
  COMPONENTS: >-
    main_lctt_certif_brd4405a main_periodical_uplink_brd4405a main_porting_tests_brd4405a main_ping_pong_brd4405a
    main_lctt_certif_brd4400c main_periodical_uplink_brd4400c main_porting_tests_brd4400c main_ping_pong_brd4400c
    main_lctt_certif_brd4187c main_periodical_uplink_brd4187c main_porting_tests_brd4187c main_ping_pong_brd4187c
    main_lctt_certif_xiao_mg24 main_periodical_uplink_xiao_mg24 main_porting_tests_xiao_mg24 main_ping_pong_xiao_mg24
  PYTHON_VARIANTS: ""
  SONAR_ANALYSIS_REF_BRANCH: "main"

jobs:
  sonarqube:
    name: SonarQube Analysis
    runs-on: self-hosted
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
          submodules: false
          fetch-depth: 0

      - name: Build Docker Image
        run: docker build -t ${{ github.event.repository.name }}-build-env:latest . --build-arg INSTALL_SONARQUBE=YES

      - name: Full Analysis (Build & Scan)
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mkdir -p .sonar_cache

          docker run --rm \
            -v "${{ github.workspace }}:/source:rw" \
            -v "${{ github.workspace }}/.sonar_cache:/root/.sonar/cache" \
            -w /source \
            -e SONAR_TOKEN="${{ secrets.SONAR_TOKEN }}" \
            -e SONAR_HOST_URL="${SONAR_HOST_URL}" \
            -e SONAR_PR_KEY="${{ github.event.pull_request.number }}" \
            -e SONAR_PR_BRANCH="${{ github.head_ref }}" \
            -e SONAR_PR_BASE="${{ github.base_ref }}" \
            -e SONAR_BRANCH_NAME="${{ github.ref_name }}" \
            -e SONAR_ANALYSIS_REF_BRANCH="${{ env.SONAR_ANALYSIS_REF_BRANCH }}" \
            -e INPUT_BRANCH="${{ github.event.inputs.branch }}" \
            -e INPUT_SONAR_BRANCH="${{ github.event.inputs.sonar-branch }}" \
            -e GITHUB_EVENT_NAME="${{ github.event_name }}" \
            -e GITHUB_SHA="${{ github.sha }}" \
            -e DEFAULT_BRANCH_NAME="${{ github.event.repository.default_branch }}" \
            -e COMPONENTS="${{ env.COMPONENTS }}" \
            -e PYTHON_VARIANTS="${{ env.PYTHON_VARIANTS }}" \
            ${{ github.event.repository.name }}-build-env:latest \
            /bin/bash -c "
              set -o pipefail && \
              chmod +x .github/sonar_build.sh .github/sonar_scanner.sh && \
              ./.github/sonar_build.sh all && \
              ./.github/sonar_scanner.sh | tee sonar.log
            " || { echo "Docker execution failed"; exit 1; }

          # Extract Task ID
          CE_TASK_ID=$(grep -oP 'id=\K[0-9a-f\-]{36}' sonar.log)
          if [ -z "$CE_TASK_ID" ]; then
            echo "Failed to extract ceTaskId from scanner output."
            cat sonar.log
            exit 1
          fi
          echo "CE_TASK_ID=$CE_TASK_ID" >> $GITHUB_ENV

      - name: Evaluate SonarQube Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Waiting for SonarQube analysis task ($CE_TASK_ID) to complete..."
          STATUS=""
          for i in $(seq 1 20); do
            sleep 10
            STATUS_JSON=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: "${SONAR_HOST_URL}/api/ce/task?id=$CE_TASK_ID")
            STATUS=$(echo "$STATUS_JSON" | jq -r '.task.status')
            if [ "$STATUS" == "SUCCESS" ]; then
              break
            elif [ "$STATUS" == "FAILED" ]; then
              echo "SonarQube task failed."
              exit 1
            fi
          done

          ANALYSIS_ID=$(echo $STATUS_JSON | jq -r '.task.analysisId')
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "SonarQube analysis did not complete successfully in time."
            exit 1
          fi

          QG_STATUS_JSON=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: "${SONAR_HOST_URL}/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")
          QG_STATUS=$(echo $QG_STATUS_JSON | jq -r '.projectStatus.status')
          echo "Sonar project page: ${SONAR_HOST_URL}/dashboard?id=devs-refd-lorawan"
          echo "Quality Gate Status: $QG_STATUS"

          if [ "$QG_STATUS" != "OK" ]; then
            echo "Quality Gate failed: $QG_STATUS"
            exit 1
          fi

      - name: Clean up workspace
        if: always()
        run: |
          echo "Cleaning up generated files using Docker (to handle root permissions)..."
          docker run --rm \
            -v "${{ github.workspace }}:/${{ github.workspace }}" \
            -w /${{ github.workspace }} \
            ${{ github.event.repository.name }}-build-env:latest \
            /bin/bash -c " \
              set -euo pipefail; \
              git config --global --add safe.directory /${{ github.workspace }} \
              && git clean -ffdx || echo '::warning::Failed to git clean workspace'; \
            "
